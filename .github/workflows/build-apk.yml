name: Build debug APK (phone-friendly)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android platform + build-tools
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Gradle 8.9
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Decode signing key
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/release.keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Build signed release APK
        run: >
          gradle :app:assembleRelease --stacktrace
          -Pandroid.injected.signing.store.file=/tmp/release.keystore
          -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD"
          -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Prepare APK files for distribution
        id: prep
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.8.1}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="v0.8.1"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/btc-alerts-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/btc-alerts-v0.8.1.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-alerts-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/btc-alerts-v0.8.0.apk
            app/build/outputs/apk/release/app-debug.apk
      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} BTC Alerts
          body: |
            ## ${{ github.ref_name }} — BTC, Gold & Oil Alert Desk
            - **3 Core Markets Only:** BTCUSD (Bybit Perp), XAUUSD (Gold Spot), and USOIL (WTI Crude Oil).
            - **Sound Settings Preview & Stop:** Interactive Play/Stop toggle per ringtone row and master Stop button to halt audio immediately.
            - **Emergency Dismiss Fix:** Dismissing the alarm window immediately stops all ringing, clears vibration, and cancels background notifications.
            - **Multi-Market Test Ring:** Test ring modal allows simulating live alarms for BTC, Gold, and Oil with verified TradingView chart deep-links.
            - **TradingView Chart Deep-Links:** Exact exchange pairs: `BYBIT:BTCUSD`, `OANDA:XAUUSD`, and `TVC:USOIL`.
            - **Candlestick Confirmations & Retests:** Level bounce, Pin Bar (hammer/shooting star), and Engulfing pattern triggers.
          files: |
            app/build/outputs/apk/release/btc-alerts-*.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-debug.apk
