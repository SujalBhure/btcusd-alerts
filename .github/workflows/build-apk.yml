name: Build debug APK (phone-friendly)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android platform + build-tools
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Gradle 8.9
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Decode signing key
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/release.keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Build signed release APK
        run: |
          if [ -s /tmp/release.keystore ] && [ -n "$ANDROID_STORE_PASSWORD" ]; then
            echo "Signing with repository secret keystore..."
            gradle :app:assembleRelease --stacktrace \
              -Pandroid.injected.signing.store.file=/tmp/release.keystore \
              -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" || \
            (echo "Release signing failed, building debug fallback..." && gradle :app:assembleDebug --stacktrace && mkdir -p app/build/outputs/apk/release && cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk)
          else
            echo "Keystore secret not present or empty, building debug release APK..."
            gradle :app:assembleDebug --stacktrace
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          fi
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Prepare APK files for distribution
        id: prep
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.8.3}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="v0.8.3"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if [ ! -f app/build/outputs/apk/release/app-release.apk ] && [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          fi
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/btc-alerts-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/btc-alerts-v0.8.3.apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-debug.apk
          else
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-debug.apk
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-alerts-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/btc-alerts-*.apk
            app/build/outputs/apk/release/app-debug.apk
      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} BTC Alerts
          fail_on_unmatched_files: false
          body: |
            ## ${{ github.ref_name }} — BTC, Gold & Oil Alert Desk
            - **Bidirectional PC & Android Sync:** Real-time two-way synchronization of price & candlestick alerts between Windows PC app and Android phone.
            - **Cloud & Local Wi-Fi Sync:** Connects seamlessly over Cloud Relay (4G/5G/Wi-Fi with zero setup) or direct local network.
            - **3 Core Markets Only:** BTCUSD (Bybit Perp), XAUUSD (Gold Spot), and USOIL (WTI Crude Oil).
            - **Multi-Condition & VWAP Alerts:** Set multiple pattern/timeframe triggers and dynamic VWAP in a single alert.
            - **Sound Settings Preview & Stop:** Interactive Play/Stop toggle per ringtone row and master Stop button.
            - **Emergency Dismiss Fix:** Dismissing the alarm window immediately stops all ringing, clears vibration, and cancels background notifications.
            - **Multi-Market Test Ring:** Test ring modal allows simulating live alarms for BTC, Gold, and Oil with verified TradingView chart deep-links.
          files: |
            app/build/outputs/apk/release/btc-alerts-*.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-debug.apk
